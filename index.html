<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friday</title>
<meta name="theme-color" content="#0b0704">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0b0704;color:#ffb347;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 24px}
#c{width:190px;height:190px;border-radius:50%;border:3px solid #ffb347;background:radial-gradient(circle,#3a1d06,#0b0704);color:#ffb347;font-size:26px;letter-spacing:3px;box-shadow:0 0 40px #ff8c0055}
#c.on{animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 80px #ff8c00aa}}
#m{font-size:16px;min-height:44px;color:#e8c9a0}
a{color:#ffb347;font-size:14px}
</style></head><body>
<button id="c">FRIDAY</button>
<div id="m">Tocca il cerchio, poi di' "Friday"</div>
<a href="hub.html">Apri Friday qui (senza Claude)</a>
<script>
var HUB="https://claude.ai/artifact/7fxWTwvMNyicurLtzARGjx";
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var WAKE=/(friday|fraidei|fraidey|fraidai|fray day|fry day|fridei|vraidei|friday's)/i;
var b=document.getElementById("c"), m=document.getElementById("m"), rec=null, on=false, lock=null;
function say(t){ m.textContent=t; }
async function keep(){ try{ lock=await navigator.wakeLock.request("screen"); }catch(_){} }
function go(){
  on=false; try{ rec&&(rec.onend=null,rec.abort()); }catch(_){}
  say("Apro Friday…"); b.classList.remove("on");
  try{ navigator.vibrate&&navigator.vibrate(60); }catch(_){}
  location.href=HUB;
}
function start(){
  if(!SR){ say("Questo telefono non ha il riconoscimento vocale."); return; }
  var r=new SR(); r.lang="it-IT"; r.continuous=true; r.interimResults=true; rec=r;
  r.onresult=function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      var t=e.results[i][0].transcript; say("«"+t.trim()+"»");
      if(WAKE.test(t)){ go(); return; }
    }
  };
  r.onerror=function(ev){
    var er=ev.error||"";
    if(er==="no-speech"||er==="aborted"||er==="network") return;
    on=false; b.classList.remove("on");
    say("Microfono non disponibile ("+er+"). Controlla il permesso microfono dell'app.");
  };
  r.onend=function(){ if(on) setTimeout(function(){ if(on) start(); },300); };
  try{ r.start(); }catch(e){ say("Errore: "+e.message); }
}
b.onclick=function(){
  if(on){ on=false; try{ rec.abort(); }catch(_){} b.classList.remove("on"); say("Fermo. Tocca per riattivare."); return; }
  on=true; b.classList.add("on"); say("Ti ascolto… di' \"Friday\""); keep(); start();
};
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(on){ try{ rec.abort(); }catch(_){} } }
  else if(on){ keep(); start(); }
});
try{ navigator.permissions.query({name:"microphone"}).then(function(r){ if(r.state==="granted") b.onclick(); }).catch(function(){}); }catch(_){}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script></body></html>
